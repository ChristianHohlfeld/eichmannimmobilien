name: Immowelt Official API

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-immowelt.mjs'
      - 'scripts/verify-listings-mirror.mjs'
      - 'scripts/lib/immowelt-official-api.mjs'
      - 'scripts/test-legal-baseline.mjs'
      - '.github/workflows/sync-immowelt.yml'
  workflow_dispatch:
  schedule:
    # daily read-only freshness check against the public mirror (07:17 Berlin summer time)
    - cron: '17 5 * * *'

permissions:
  contents: write

concurrency:
  group: immowelt-official-api
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify official Immowelt API endpoints
        shell: bash
        run: |
          set -euo pipefail
          for service in EstateService EstateExpose; do
            url="https://api.immowelt.de/WebServices/${service}.asmx?WSDL"
            echo "Checking ${url}"
            curl --fail --silent --show-error --location --max-time 20 "${url}" -o "/tmp/${service}.wsdl"
            test -s "/tmp/${service}.wsdl"
          done
          grep -q "GetListCustomerProjects" /tmp/EstateService.wsdl
          grep -q "GetEstateExposeByEstateGuid" /tmp/EstateExpose.wsdl
          echo "Official Immowelt SOAP API WSDL reachable."

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for path in ["/tmp/EstateService.wsdl", "/tmp/EstateExpose.wsdl"]:
              root = ET.parse(path).getroot()
              print("\nSCHEMA", path)
              for el in root.iter():
                  name = el.attrib.get("name", "")
                  if name in {
                      "GetListCustomerProjects", "GetListCustomerProjectsResponse",
                      "EstateServiceListResponse", "EstatePropertyListEstateProperty",
                      "ArrayOfEstateParameter", "EstateParameter", "ListAuthenticationHeader",
                      "ApiAuthenticationHeaderBase",
                      "GetEstateExposeByEstateGuid", "GetEstateExposeByEstateGuidResponse",
                      "ExposeServiceResponse", "ExposeAuthenticationHeader",
                  }:
                      print(ET.tostring(el, encoding="unicode")[:12000])
          PY

      - name: Verify listings against public mirror (read-only; fail-closed)
        continue-on-error: true
        run: node scripts/verify-listings-mirror.mjs

      - name: Build from SSOT (validate → render → EN → flyer → cache hashes → output rules)
        run: node scripts/build.mjs

      - name: Legal baseline
        run: node scripts/test-legal-baseline.mjs

      - name: Listing content integrity
        run: node scripts/test-listing-content.mjs

      - name: Commit generated legal/render changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # render-only also refreshes the shared source and AI discovery files.
          # Keep every generated output staged so the rebase/push cannot leave
          # a dirty worktree (and so the deploy ships the same source of truth).
          # Project pages (allmannsdorf.html, …) are re-rendered too — commit them with the rest.
          git add -A -- data/sot data/projects.json en partials *.html index.html projekte.html allmannsdorf.html wollmatingen.html wohnung-kaufen-konstanz.html partials/listings-grid.html objekt sitemap.xml data/listings.json data/immowelt-sync-status.json data/sitemap-lastmod.json agents.txt llms.txt ai .well-known/mcp.json .well-known/mcp/catalog.json css js
          git status --short
          if git diff --staged --quiet; then
            echo "Generated output already current."
          else
            git commit -m "chore: render Immowelt attribution"
            # Any other incidental render output must never block the rebase. Other
            # workflows (layout-regression render) may push at the same moment: retry,
            # and on overlapping generated files keep this fresh render (-X theirs).
            for attempt in 1 2 3 4; do
              if git pull --rebase --autostash -X theirs origin main && git push; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "push attempt ${attempt} lost a race; retrying"
              sleep $((attempt * 5))
            done
            exit 1
          fi
