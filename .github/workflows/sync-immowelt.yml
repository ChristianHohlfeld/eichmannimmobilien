name: Sync Immowelt Listings

on:
  schedule:
    # Daily 05:00 UTC ≈ 07:00 Europe/Berlin (winter) / 06:00 CEST
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      force_from_json:
        description: "Skip scrape and only re-render from data/listings.json"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-immowelt
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright Chromium
        if: ${{ inputs.force_from_json != true }}
        run: npx playwright install chromium --with-deps

      - name: Sync listings from Immowelt
        if: ${{ inputs.force_from_json != true }}
        env:
          IMMOWELT_PROFILE_URL: https://www.immowelt.de/profil/3b18336c6a2e401da38e9cc20268270d
        run: node scripts/sync-immowelt.mjs

      - name: Render only from canonical JSON
        if: ${{ inputs.force_from_json == true }}
        run: node scripts/sync-immowelt.mjs --render-only

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/listings.json assets/listings partials/listings-grid.html index.html projekte.html
          if git diff --staged --quiet; then
            echo "No listing changes."
          else
            git commit -m "chore: sync Immowelt listings ($(date -u +%Y-%m-%d))"
            git push
          fi
