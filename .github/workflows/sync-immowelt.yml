name: Immowelt Official API

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-immowelt.mjs'
      - 'scripts/lib/immowelt-official-api.mjs'
      - 'scripts/test-legal-baseline.mjs'
      - '.github/workflows/sync-immowelt.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: immowelt-official-api
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify official Immowelt API endpoints
        shell: bash
        run: |
          set -euo pipefail
          for service in EstateService EstateExpose; do
            url="https://api.immowelt.de/WebServices/${service}.asmx?WSDL"
            echo "Checking ${url}"
            curl --fail --silent --show-error --location --max-time 20 "${url}" -o "/tmp/${service}.wsdl"
            test -s "/tmp/${service}.wsdl"
          done
          grep -q "GetListCustomerProjects" /tmp/EstateService.wsdl
          grep -q "GetEstateExposeByEstateGuid" /tmp/EstateExpose.wsdl
          echo "Official Immowelt SOAP API WSDL reachable."

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for path in ["/tmp/EstateService.wsdl", "/tmp/EstateExpose.wsdl"]:
              root = ET.parse(path).getroot()
              print("\nSCHEMA", path)
              for el in root.iter():
                  name = el.attrib.get("name", "")
                  if name in {
                      "GetListCustomerProjects", "GetListCustomerProjectsResponse",
                      "EstateServiceListResponse", "EstatePropertyListEstateProperty",
                      "ArrayOfEstateParameter", "EstateParameter", "ListAuthenticationHeader",
                      "ApiAuthenticationHeaderBase",
                      "GetEstateExposeByEstateGuid", "GetEstateExposeByEstateGuidResponse",
                      "ExposeServiceResponse", "ExposeAuthenticationHeader",
                  }:
                      print(ET.tostring(el, encoding="unicode")[:12000])
          PY

      - name: Render current last-known-good snapshot
        run: node scripts/sync-immowelt.mjs --render-only

      - name: Legal baseline
        run: node scripts/test-legal-baseline.mjs

      - name: Listing content integrity
        run: node scripts/test-listing-content.mjs

      - name: Commit generated legal/render changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # render-only also refreshes the shared source and AI discovery files.
          # Keep every generated output staged so the rebase/push cannot leave
          # a dirty worktree (and so the deploy ships the same source of truth).
          # Project pages (allmannsdorf.html, …) are re-rendered too — commit them with the rest.
          git add -A -- index.html projekte.html allmannsdorf.html partials/listings-grid.html objekt sitemap.xml data/listings.json agents.txt llms.txt ai .well-known/mcp.json .well-known/mcp/catalog.json
          git status --short
          if git diff --staged --quiet; then
            echo "Generated output already current."
          else
            git commit -m "chore: render Immowelt attribution"
            # Any other incidental render output must never block the rebase.
            git pull --rebase --autostash origin main
            git push
          fi
