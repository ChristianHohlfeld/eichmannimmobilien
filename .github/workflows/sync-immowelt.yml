name: Sync Immowelt Listings

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-immowelt.mjs'
      - '.github/workflows/sync-immowelt.yml'
  schedule:
    # Every 3 hours (UTC). Soft-fails on DataDome keep last good list.
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      force_from_json:
        description: "Skip scrape and only re-render from data/listings.json"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-immowelt
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright Chromium
        if: ${{ inputs.force_from_json != true }}
        run: npx playwright install chromium --with-deps

      - name: Refresh detail galleries from canonical listings
        if: ${{ github.event_name == 'push' && inputs.force_from_json != true }}
        run: node scripts/sync-immowelt.mjs --enrich-only --force-scrape

      - name: Full sync from Immowelt
        if: ${{ github.event_name != 'push' && inputs.force_from_json != true }}
        env:
          IMMOWELT_PROFILE_URL: https://www.immowelt.de/profil/3b18336c6a2e401da38e9cc20268270d
        run: node scripts/sync-immowelt.mjs

      - name: Render only from canonical JSON
        if: ${{ inputs.force_from_json == true }}
        run: node scripts/sync-immowelt.mjs --render-only

      - name: Verify published listing detail completeness
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir } from "node:fs/promises";
          const raw = JSON.parse(await readFile("data/listings.json", "utf8"));
          const listings = Array.isArray(raw) ? raw : raw.listings || [];
          const problems = [];
          for (const item of listings) {
            if (!String(item.description || "").trim()) problems.push(`${item.slug}: missing description`);
            if (!Array.isArray(item.gallery_bases) || item.gallery_bases.length < 2) problems.push(`${item.slug}: gallery has <2 images`);
          }
          for (const name of await readdir("objekt")) {
            if (!name.endsWith(".html")) continue;
            const html = await readFile("objekt/" + name, "utf8");
            if (html.includes("Ausführliche Objektbeschreibung folgt mit dem nächsten Immowelt-Abgleich") ||
                html.includes("Die ausführliche Objektbeschreibung stellen wir Ihnen gerne auf Anfrage zu")) {
              problems.push(name + ": synthetic description fallback");
            }
          }
          if (problems.length) {
            console.error("Refusing to publish incomplete Exposés:\n" + problems.join("\n"));
            process.exit(1);
          }
          console.log(`Detail quality OK: ${listings.length} listings with real descriptions and galleries.`);
          NODE

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/listings.json assets/listings partials/listings-grid.html index.html projekte.html objekt sitemap.xml
          if git diff --staged --quiet; then
            echo "No listing changes."
          else
            git commit -m "chore: sync Immowelt listings ($(date -u +%Y-%m-%d))"
            # Other site-only commits may land while the enrichment job is
            # downloading galleries. Rebase generated output onto current main
            # instead of losing a successful 10+ minute sync at push time.
            git pull --rebase origin main
            git push
          fi
