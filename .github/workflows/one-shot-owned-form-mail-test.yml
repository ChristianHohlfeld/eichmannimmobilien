name: One-shot owned form mail test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-owned-form-mail-test.yml'

jobs:
  send:
    if: ${{ contains(github.event.head_commit.message, '[owned-form-mail-test]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send labelled Helmut contact test
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body -sS \
            -H 'Origin: https://immobilieneichmann.de' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data '{"name":"TEST FÜR HELMUT – Websiteprüfung","email":"info@immobilien-eichmann.com","phone":"000000000","anliegen":"TEST – Kontaktformular","message":"AUTOMATISCHER WEBSITE-TEST FÜR HELMUT – KEINE ECHTE KUNDENANFRAGE. Bitte ignorieren. Test des allgemeinen Kontaktformulars.","test_hinweis":"AUTOMATISCHER WEBSITE-TEST FÜR HELMUT – KEINE ECHTE KUNDENANFRAGE. Bitte ignorieren."}' \
            'https://forms.digitalisierungsplanung.de/v1/immobilieneichmann/contact')"
          printf '%s\n' "$response"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.success!==true) process.exit(1)' "$response"

      - name: Send labelled Helmut expose test
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body -sS \
            -H 'Origin: https://immobilieneichmann.de' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data '{"anrede":"Herr","vorname":"TEST","name":"FÜR HELMUT – Websiteprüfung","strasse":"Teststraße 1","plz":"78462","ort":"Konstanz","phone":"000000000","email":"info@immobilien-eichmann.com","objekt":"TEST – Exposé-Anfrage – KEINE ECHTE KUNDENANFRAGE","objekt_url":"https://immobilieneichmann.de/objekt/penthouse-konigsbau-c6b1d820.html","test_hinweis":"AUTOMATISCHER WEBSITE-TEST FÜR HELMUT – KEINE ECHTE KUNDENANFRAGE. Bitte ignorieren."}' \
            'https://forms.digitalisierungsplanung.de/v1/immobilieneichmann/expose')"
          printf '%s\n' "$response"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.success!==true) process.exit(1)' "$response"
