name: Immowelt ops (server)

# The server-side commands of scripts/immowelt-sync.mjs, run over SSH with the deploy key –
# for the cutover (identity plan → approval) and for operations (status, run now, hold,
# resume, rollback, timers). Output contains offer ids, slugs, public titles/prices and
# counts; never the API key.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Was soll auf dem Server passieren?"
        type: choice
        required: true
        options:
          - status
          - identity-plan
          - identity-apply
          - run
          - history
          - reslug
          - releases
          - hold
          - resume
          - rollback-data
          - rollback-release
          - timers-enable
          - timers-disable
          - admin-password-set
          - github-token-install
          - watchdog
          - heartbeat-install
          - heartbeat-off
          - shared-password-status
          - shared-password-off
          - mail-key
          - mail-gateway-on
          - mail-install
          - mail-status
          - mail-test
          - vorher-on
          - vorher-off
      plan_hash:
        description: "identity-apply: Hash aus dem geprüften Plan"
        required: false
      reason:
        description: "hold: Grund (kurz)"
        required: false

permissions:
  contents: read

concurrency:
  group: immowelt-ops
  cancel-in-progress: false

jobs:
  ops:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup SSH
        env:
          DEPLOY_KEY: ${{ secrets.EICHMANN_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.EICHMANN_DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ secrets.EICHMANN_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/eichmann_deploy
          chmod 600 ~/.ssh/eichmann_deploy
          # Pin the server's host key (secret EICHMANN_KNOWN_HOSTS = output of "ssh-keyscan <host>", checked once on the
          # server). Without the secret the key is taken on trust at first contact – set it before installing the API key.
          if [ -n "${KNOWN_HOSTS:-}" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; else echo "::warning::EICHMANN_KNOWN_HOSTS ist nicht gesetzt – der Server wird nicht authentifiziert."; ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true; fi
      - name: Run
        env:
          ACTION: ${{ inputs.action }}
          PLAN_HASH: ${{ inputs.plan_hash }}
          REASON: ${{ inputs.reason }}
          DEPLOY_HOST: ${{ secrets.EICHMANN_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.EICHMANN_DEPLOY_USER }}
        run: |
          set -euo pipefail
          # Inputs are data, never shell: strict patterns, then passed as environment to the remote script.
          [[ "${ACTION:-}" =~ ^[a-z-]{2,24}$ ]] || { echo "action ungültig"; exit 1; }
          [[ "${PLAN_HASH:-}" =~ ^[0-9a-f]{0,16}$ ]] || { echo "plan_hash ungültig"; exit 1; }
          REASON_CLEAN="$(printf '%s' "${REASON:-}" | tr -cd 'A-Za-z0-9 .,:_/-' | cut -c1-120)"
          ssh -i ~/.ssh/eichmann_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "ACTION=$(printf '%q' "$ACTION") PLAN_HASH=$(printf '%q' "${PLAN_HASH:-}") REASON=$(printf '%q' "$REASON_CLEAN") bash -s" <<'REMOTE'
          set -euo pipefail
          cd /var/lib/eichmann/app
          export EICHMANN_DB_PATH=/var/lib/eichmann/listings.db
          case "$ACTION" in
            status)           node scripts/immowelt-sync.mjs status || true; systemctl list-timers --all --no-pager 'eichmann-*' || true; systemctl --no-pager --failed || true ;;
            identity-plan)    node scripts/immowelt-sync.mjs identity-plan ;;
            identity-apply)   test -n "$PLAN_HASH" || { echo "plan_hash fehlt"; exit 1; }; node scripts/immowelt-sync.mjs identity-apply --plan-hash "$PLAN_HASH" ;;
            run)              node scripts/immowelt-sync.mjs run --trigger manual --wait 300 ;;
            reslug)           node scripts/immowelt-sync.mjs reslug ;;
            history)          node scripts/immowelt-sync.mjs history --limit 40 ;;
            releases)         node scripts/release.mjs list ;;
            hold)             node scripts/immowelt-sync.mjs hold --reason "${REASON:-ohne Angabe}" ;;
            resume)           node scripts/immowelt-sync.mjs resume && node scripts/immowelt-sync.mjs run --trigger manual --wait 300 ;;
            rollback-data)    node scripts/immowelt-sync.mjs rollback ;;
            rollback-release) node scripts/release.mjs rollback ;;
            timers-enable)    bash deploy/install-immowelt-sync.sh --enable ;;
            timers-disable)   bash deploy/install-immowelt-sync.sh --disable ;;
            # the untouched pre-cutover webroot, temporarily reachable below /admin/sichtpruefung/_vorher/ for the "before" pictures
            vorher-on)        OLD="$(ls -d /var/www/immobilieneichmann.de.pre-release-* | tail -1)"; test -d "$OLD"; mkdir -p /var/lib/eichmann/review; ln -sfn "$OLD" /var/lib/eichmann/review/_vorher; echo "verlinkt: $OLD" ;;
            vorher-off)       rm -f /var/lib/eichmann/review/_vorher; echo "entfernt" ;;
            # the server watchdog, now: sync fresh? public site right? → sign of life (output names no address)
            watchdog)         node scripts/watchdog-check.mjs --local || echo "::warning::Wächter meldet ein Problem (siehe Ausgabe)." ;;
            heartbeat-off)    node scripts/alarm-install.mjs --off ;;
            # mail for "Passwort vergessen": what is configured / a test message to every sign-in address
            # usual way: through the form gateway that already delivers the inquiries. mail-key creates this
            # server's signing key once and prints its PUBLIC half (not a secret; the gateway needs it).
            # mail-gateway-on asks the gateway whether it accepts this server and only then switches on.
            # retire the old shared admin password (its hash is in the public git history). Only works once the
            # reset mail is switched on; afterwards everyone signs in with an own password ("Passwort vergessen?").
            shared-password-status) EICHMANN_ADMIN_CONFIG=/var/www/immobilieneichmann.de/admin/config.json node scripts/admin-shared-password-off.mjs --status ;;
            shared-password-off)    EICHMANN_ADMIN_CONFIG=/var/www/immobilieneichmann.de/admin/config.json node scripts/admin-shared-password-off.mjs ;;
            mail-key)         node scripts/mail-install.mjs --key ;;
            mail-gateway-on)  node scripts/mail-install.mjs --gateway-on ;;
            mail-status)      node scripts/mail-install.mjs --status ;;
            mail-test)        EICHMANN_ADMIN_CONFIG=/var/www/immobilieneichmann.de/admin/config.json node scripts/mail-install.mjs --test ;;
            admin-password-set|github-token-install|heartbeat-install|mail-install) echo "wird im nächsten Schritt gesetzt" ;;
            *) echo "unbekannte Aktion"; exit 2 ;;
          esac
          REMOTE
      - name: Set admin password (from secret EICHMANN_ADMIN_NEW_PASSWORD, STDIN only)
        if: inputs.action == 'admin-password-set'
        env:
          NEW_PASSWORD: ${{ secrets.EICHMANN_ADMIN_NEW_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.EICHMANN_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.EICHMANN_DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "${NEW_PASSWORD:-}" || { echo "::error::Secret EICHMANN_ADMIN_NEW_PASSWORD fehlt oder ist leer – nichts geändert."; exit 1; }
          # Never printed, never an argument: runner → SSH → STDIN of the script. Delete the secret afterwards.
          printf '%s' "$NEW_PASSWORD" | ssh -i ~/.ssh/eichmann_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "cd /var/lib/eichmann/app && node scripts/admin-password-set.mjs"
          echo "Admin-Passwort gesetzt. Bitte das Secret EICHMANN_ADMIN_NEW_PASSWORD jetzt wieder löschen." >> "$GITHUB_STEP_SUMMARY"
      - name: Install GitHub token for the admin trigger (from secret EICHMANN_DISPATCH_TOKEN, STDIN only)
        if: inputs.action == 'github-token-install'
        env:
          DISPATCH_TOKEN: ${{ secrets.EICHMANN_DISPATCH_TOKEN }}
          DEPLOY_HOST: ${{ secrets.EICHMANN_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.EICHMANN_DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "${DISPATCH_TOKEN:-}" || { echo "::error::Secret EICHMANN_DISPATCH_TOKEN fehlt oder ist leer – nichts geändert."; exit 1; }
          printf '%s' "$DISPATCH_TOKEN" | ssh -i ~/.ssh/eichmann_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "cd /var/lib/eichmann/app && node scripts/github-token-install.mjs"
      - name: Install the sign-of-life address (from secret EICHMANN_HEARTBEAT_URL, STDIN only) and send the first one
        if: inputs.action == 'heartbeat-install'
        env:
          HEARTBEAT_URL: ${{ secrets.EICHMANN_HEARTBEAT_URL }}
          DEPLOY_HOST: ${{ secrets.EICHMANN_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.EICHMANN_DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "${HEARTBEAT_URL:-}" || { echo "::error::Secret EICHMANN_HEARTBEAT_URL fehlt oder ist leer – nichts geändert."; exit 1; }
          printf '%s' "$HEARTBEAT_URL" | ssh -i ~/.ssh/eichmann_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "cd /var/lib/eichmann/app && node scripts/alarm-install.mjs"
          ssh -i ~/.ssh/eichmann_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "cd /var/lib/eichmann/app && node scripts/watchdog-check.mjs --local" || echo "::warning::Wächter meldet ein Problem (siehe Ausgabe)."
          echo "Lebenszeichen eingerichtet; der Wächter meldet sich ab jetzt alle 15 Minuten." >> "$GITHUB_STEP_SUMMARY"
      - name: Install mail settings for "Passwort vergessen" (from secret EICHMANN_MAIL_URL, STDIN only)
        if: inputs.action == 'mail-install'
        env:
          MAIL_URL: ${{ secrets.EICHMANN_MAIL_URL }}
          DEPLOY_HOST: ${{ secrets.EICHMANN_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.EICHMANN_DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "${MAIL_URL:-}" || { echo "::error::Secret EICHMANN_MAIL_URL fehlt oder ist leer – nichts geändert."; exit 1; }
          printf '%s' "$MAIL_URL" | ssh -i ~/.ssh/eichmann_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "cd /var/lib/eichmann/app && node scripts/mail-install.mjs"
          echo "Mailversand eingerichtet. Mit der Aktion mail-test eine Probe an alle Anmelde-Adressen schicken; danach das Secret EICHMANN_MAIL_URL löschen." >> "$GITHUB_STEP_SUMMARY"
