name: Verify live expose transport
on:
  push:
    branches: [main]
    paths:
      - 'scripts/test-expose-form.mjs'
      - '.github/workflows/verify-expose-live.yml'

jobs:
  verify:
    if: ${{ contains(github.event.head_commit.message, '[live-form-test]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser flow with mocked transport
        run: node scripts/test-expose-form.mjs
      - name: One-time real FormSubmit transport check
        shell: bash
        run: |
          set -euo pipefail
          payload='{"anrede":"Herr","vorname":"Technischer","name":"Test","strasse":"Teststraße 1","plz":"78462","ort":"Konstanz","phone":"000000000","email":"technical-test@example.com","anliegen":"Exposé-Anfrage","objekt":"TECHNISCHER TEST – bitte ignorieren","objekt_url":"https://immobilieneichmann.de/","_subject":"TECHNISCHER TEST Exposé-Formular – bitte ignorieren","_template":"table","_captcha":"false"}'
          response="$(curl --fail-with-body -sS -X POST \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -H 'Origin: https://immobilieneichmann.de' \
            -H 'Referer: https://immobilieneichmann.de/objekt/penthouse-konigsbau-c6b1d820.html' \
            -H 'User-Agent: Mozilla/5.0' \
            --data "$payload" \
            'https://formsubmit.co/ajax/info@immobilien-eichmann.com')"
          echo "$response"
          RESPONSE="$response" node -e 'const r=JSON.parse(process.env.RESPONSE); if (!(r.success===true || r.success==="true")) { console.error(r); process.exit(1); }'
