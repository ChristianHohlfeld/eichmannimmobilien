name: Data age check
# Öffnet ein Issue, wenn der Datenstand (ältestes Prüfdatum aktiver Objekte) älter als 14 Tage ist.
# Stoppt keinen Build – ein alter Datenstand soll eine Tippfehler-Korrektur nicht blockieren.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  age:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Check data age
        id: age
        run: |
          D=$(node -e 'import("./scripts/lib/sot.mjs").then(m=>console.log(m.loadSot().dataAsOf||""))')
          AGE=$(( ( $(date +%s) - $(date -d "$D" +%s) ) / 86400 ))
          echo "date=$D" >> "$GITHUB_OUTPUT"; echo "age=$AGE" >> "$GITHUB_OUTPUT"
          echo "Datenstand $D, $AGE Tage alt"
      - name: Open issue if older than 14 days
        if: steps.age.outputs.age > 14
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          T="Datenstand ${{ steps.age.outputs.date }} ist ${{ steps.age.outputs.age }} Tage alt"
          gh issue list --state open --search "Datenstand in:title" --json number --jq '.[0].number' | grep -q . && exit 0
          gh issue create --title "$T" --body "Die Objekte wurden seit ${{ steps.age.outputs.date }} nicht mehr erfolgreich abgeglichen (täglicher Abgleich fail-closed). Bitte die Exposés prüfen und \`node scripts/sot-cli.mjs verify --all\` ausführen (oder Preis/verkauft per sot-cli pflegen), dann \`node scripts/build.mjs\`."
