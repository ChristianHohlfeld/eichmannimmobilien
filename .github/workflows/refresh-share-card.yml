name: Refresh approved share image
on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-share-card.mjs'
      - '.github/workflows/refresh-share-card.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fetch approved property image and build plain card
        run: node scripts/refresh-share-card.mjs
      - name: Verify share metadata and pixels
        run: npm run test:share
      - name: Commit share image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/share-card-source-plain-v2.jpg assets/share-card-plain-v2.jpg assets/share-card-house-orig-v1.jpg assets/share-card.jpg
          if git diff --staged --quiet; then
            echo "No share-card changes."
          else
            git commit -m "fix: populate approved plain share image"
            git push
          fi
