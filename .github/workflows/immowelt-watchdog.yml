name: Immowelt sync watchdog

# Independent of the server: reads the public status of the live site every 30 minutes and
# fails (→ GitHub notifies the repository owner) when
#   - the last complete Immowelt read is older than the limit (job not running, API down, key revoked …)
#   - the last run failed / waits for the identity migration / is on hold
#   - the site does not serve the release, offer count or data date the sync reports
#   - an offer page does not answer
# Replaces data-age.yml (weekly, 14 days, read a file in the repository instead of the live site).
#
# On since the go-live of 11.11.2026. Switch off with the repository variable
# IMMOWELT_WATCHDOG_ENABLED=false (Settings → Variables). Manual runs always work.

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Basis-URL"
        default: "https://immobilieneichmann.de"

permissions:
  contents: read
  actions: write

concurrency:
  group: immowelt-watchdog
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || vars.IMMOWELT_WATCHDOG_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check live status and site
        env:
          BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.url || 'https://immobilieneichmann.de' }}
        run: node scripts/watchdog-check.mjs --url "$BASE_URL"
      - name: Keep this schedule alive (GitHub pauses schedules in public repos after 60 days without activity)
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/immowelt-watchdog.yml/enable" || true
      # The review in the admin area (/admin/sichtpruefung/) renews itself about once a day: this run starts
      # "Immowelt verify live" when the last good review is older than 20 hours and none was started in the
      # last 2 hours. Uses this run's own short-lived token – nothing is stored on the server.
      - name: Renew the review (Sichtprüfung) when it is a day old
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: repos/${{ github.repository }}/actions/workflows/immowelt-verify-live.yml
        run: |
          set -euo pipefail
          minutes_since() { [[ -n "$1" ]] && echo $(( ( $(date -u +%s) - $(date -u -d "$1" +%s) ) / 60 )) || echo 999999; }
          good=$(minutes_since "$(gh api "$RUNS/runs?per_page=1&status=success" --jq '.workflow_runs[0].created_at // ""')")
          any=$(minutes_since "$(gh api "$RUNS/runs?per_page=1" --jq '.workflow_runs[0].created_at // ""')")
          if (( good >= 1200 && any >= 120 )); then
            gh api --method POST "$RUNS/dispatches" -f ref=main -f 'inputs[label]=check' -f 'inputs[api]=true'
            echo "Sichtprüfung gestartet (letzte gute vor ${good} min)." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Sichtprüfung nicht nötig (letzte gute vor ${good} min, letzter Start vor ${any} min)."
          fi
