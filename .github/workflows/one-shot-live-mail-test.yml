name: One-shot live mail test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-live-mail-test.yml'

jobs:
  test:
    if: ${{ contains(github.event.head_commit.message, '[one-shot-mail-test]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Submit one clearly labelled test per public mail flow
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });

          async function nativeSubmit(page, label) {
            const nav = page.waitForNavigation({ waitUntil: 'domcontentloaded', timeout: 30000 }).catch(() => null);
            await page.locator('#contact-form').evaluate((form, label) => {
              let subject = form.querySelector('[name="_subject"]');
              if (!subject) {
                subject = document.createElement('input');
                subject.type = 'hidden';
                subject.name = '_subject';
                form.appendChild(subject);
              }
              subject.value = '[TEST FÜR HELMUT – BITTE IGNORIEREN] ' + label;

              let note = form.querySelector('[name="test_hinweis"]');
              if (!note) {
                note = document.createElement('input');
                note.type = 'hidden';
                note.name = 'test_hinweis';
                form.appendChild(note);
              }
              note.value = 'AUTOMATISCHER WEBSITE-TEST FÜR HELMUT – KEINE ECHTE KUNDENANFRAGE. Bitte ignorieren.';

              HTMLFormElement.prototype.submit.call(form);
            }, label);
            const response = await nav;
            if (!response) throw new Error(label + ': no navigation after native form submit');
            const status = response.status();
            const url = response.url();
            const text = (await page.locator('body').innerText().catch(() => '')).slice(0, 1500);
            console.log(label, { status, url, body: text });
            if (status < 200 || status >= 400) throw new Error(label + ': HTTP ' + status);
            if (/activate|activation|confirm your email|bestätig/i.test(text)) {
              throw new Error(label + ': FormSubmit recipient still requires activation');
            }
            if (/error|forbidden|blocked/i.test(text) && !/thank|thanks|success|submitted/i.test(text)) {
              throw new Error(label + ': FormSubmit returned error page');
            }
          }

          // Flow 1: allgemeines Kontaktformular.
          {
            const page = await browser.newPage();
            await page.goto('https://immobilieneichmann.de/kontakt.html', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.fill('[name="name"]', 'TEST FÜR HELMUT – Websiteprüfung');
            await page.fill('[name="email"]', 'info@immobilien-eichmann.com');
            await page.fill('[name="phone"]', '000000000');
            await page.selectOption('[name="anliegen"]', 'Allgemeine Anfrage');
            await page.fill('[name="message"]',
              'AUTOMATISCHER WEBSITE-TEST FÜR HELMUT – KEINE ECHTE KUNDENANFRAGE. Bitte ignorieren. Test des allgemeinen Kontaktformulars.'
            );
            if (!(await page.locator('#contact-form').evaluate((f) => f.checkValidity()))) {
              throw new Error('Kontakt: form invalid before submit');
            }
            await nativeSubmit(page, 'Kontaktformular');
            await page.close();
          }

          // Flow 2: objektbezogene Exposé-Anfrage.
          {
            const page = await browser.newPage();
            await page.goto('https://immobilieneichmann.de/objekt/penthouse-konigsbau-c6b1d820.html', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.selectOption('[name="anrede"]', 'Herr');
            await page.fill('[name="vorname"]', 'TEST');
            await page.fill('[name="name"]', 'FÜR HELMUT – Websiteprüfung');
            await page.fill('[name="strasse"]', 'Teststraße 1');
            await page.fill('[name="plz"]', '78462');
            await page.fill('[name="ort"]', 'Konstanz');
            await page.fill('[name="phone"]', '000000000');
            await page.fill('[name="email"]', 'info@immobilien-eichmann.com');
            if (!(await page.locator('#contact-form').evaluate((f) => f.checkValidity()))) {
              throw new Error('Exposé: form invalid before submit');
            }
            await nativeSubmit(page, 'Exposé-Anfrage – KEINE ECHTE KUNDENANFRAGE');
            await page.close();
          }

          await browser.close();
          console.log('PASS — both public mail flows submitted as clearly labelled Helmut tests.');
          NODE
