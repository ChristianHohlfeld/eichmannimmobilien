name: Immowelt verify live (screenshots + review page)

# Evidence for a rollout, produced from outside the server. Nothing is written anywhere else.
#
#   label = before   run BEFORE the sync changes anything: the complete page inventory of the live
#                    site (sitemap + every internally linked page), desktop 1440×900 and mobile
#                    390×844, whole page. Note the run number – the "after" run asks for it.
#   label = after    run after the publish: same inventory, same viewports; the comparison table
#                    API ↔ published ↔ pages for every offer; with "api" the Immowelt API is read
#                    fresh (read-only) and every offer is rendered as an Immowelt reference picture.
#                    With "before_run_id" the review page is built:
#                    per page three pictures – before (dt-1) · after (dt) · Immowelt (dt).
#   label = check    like "after", any time.
#
# The public Immowelt pages themselves cannot be photographed from here (Immowelt answers
# data-centre addresses with 403, and nothing is circumvented). They are added on your own
# computer: scripts/verify/capture-screens.mjs --label immowelt --headed, see docs/IMMOWELT-SYNC.md.
#
# Results: artifact "immowelt-verify-<label>-<run id>" (kept 90 days); open verify/review/index.html.

on:
  workflow_dispatch:
    inputs:
      label:
        description: "Aufnahme: before = vor dem Sync, after = nach der Veröffentlichung, check = jederzeit"
        type: choice
        options: [before, after, check]
        default: check
      api:
        description: "Immowelt-API frisch lesen (nur lesend): Datenvergleich + Immowelt-Referenzbilder"
        type: boolean
        default: false
      before_run_id:
        description: "Nur bei after/check: Laufnummer (Run-ID) der before-Aufnahme → Sichtprüfung mit Vorher/Nachher"
        required: false
      url:
        description: "Basis-URL"
        default: "https://immobilieneichmann.de"

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04 # Playwright --with-deps kennt Ubuntu 26 (ubuntu-latest im Wechsel) noch nicht
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # The runner image already has the system libraries; a failing apt mirror must not stop the browser download.
      - run: npx playwright install --with-deps chromium || npx playwright install chromium

      - name: Screenshots – complete page inventory (desktop + mobile, whole page)
        env:
          LABEL: ${{ inputs.label }}
          BASE_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          [[ "$BASE_URL" =~ ^https?://[A-Za-z0-9._:-]+/?$ ]] || { echo "url ungültig"; exit 1; }
          # check = an "after" picture taken at any time
          node scripts/verify/capture-screens.mjs --label "$([ "$LABEL" = before ] && echo before || echo after)" --base "$BASE_URL"

      - name: Comparison table (every offer)
        if: always()
        env:
          LABEL: ${{ inputs.label }}
          BASE_URL: ${{ inputs.url }}
          USE_API: ${{ inputs.api }}
          IMMOWELT_API_KEY: ${{ inputs.api && secrets.IMMOWELT_API_KEY || '' }}
        run: |
          set -euo pipefail
          mkdir -p test-results/verify
          NAME="$([ "$LABEL" = before ] && echo before || echo after)"
          ARGS=(--base "$BASE_URL" --out "test-results/verify/inventory-${NAME}.md" --json "test-results/verify/inventory-${NAME}.json")
          if [ "$USE_API" = "true" ]; then ARGS+=(--api --api-snapshot test-results/verify/api-snapshot.json); fi
          # "before" documents the old state: differences are the expected finding there, not a failure.
          if [ "$LABEL" = "before" ]; then ARGS+=(--report-only); fi
          node scripts/verify/inventory-report.mjs "${ARGS[@]}"

      - name: Immowelt reference pictures (every offer as the API delivers it)
        if: always() && inputs.api
        run: |
          set -euo pipefail
          test -f test-results/verify/api-snapshot.json || { echo "Kein API-Stand gelesen – keine Referenzbilder."; exit 0; }
          node scripts/verify/capture-screens.mjs --label immowelt-api --snapshot test-results/verify/api-snapshot.json

      - name: Watchdog check (status, release, every offer page)
        if: always() && inputs.label != 'before'
        env:
          BASE_URL: ${{ inputs.url }}
        run: node scripts/watchdog-check.mjs --url "$BASE_URL" || echo "::warning::Wächter meldet ein Problem – siehe Zusammenfassung."

      - name: Setup SSH (review is kept on the server)
        if: always() && inputs.label != 'before' && github.ref == 'refs/heads/main' && inputs.url == 'https://immobilieneichmann.de'
        env:
          DEPLOY_KEY: ${{ secrets.EICHMANN_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.EICHMANN_DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ secrets.EICHMANN_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/eichmann_deploy
          chmod 600 ~/.ssh/eichmann_deploy
          if [ -n "${KNOWN_HOSTS:-}" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true; fi
          echo "HAVE_SSH=1" >> "$GITHUB_ENV"

      - name: Before = the pictures of the previous check (from the server)
        if: always() && env.HAVE_SSH == '1' && inputs.before_run_id == ''
        env:
          DEPLOY_HOST: ${{ secrets.EICHMANN_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.EICHMANN_DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p test-results/verify/screens/before
          rsync -az -e "ssh -i ~/.ssh/eichmann_deploy -o IdentitiesOnly=yes" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/var/lib/eichmann/review/screens/after/" test-results/verify/screens/before/ \
            || { echo "Noch keine frühere Aufnahme auf dem Server."; rm -rf test-results/verify/screens/before; exit 0; }
          # what was "after" last time is "before" now
          if [ -f test-results/verify/screens/before/manifest.json ]; then sed -i 's/"label": "after"/"label": "before"/' test-results/verify/screens/before/manifest.json; else rm -rf test-results/verify/screens/before; fi

      - name: Fetch the "before" pictures of an earlier run
        if: always() && inputs.label != 'before' && inputs.before_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_RUN_ID: ${{ inputs.before_run_id }}
        run: |
          set -euo pipefail
          [[ "$BEFORE_RUN_ID" =~ ^[0-9]{5,20}$ ]] || { echo "before_run_id ist keine Laufnummer"; exit 1; }
          gh run download "$BEFORE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "immowelt-verify-before-${BEFORE_RUN_ID}" --dir before-artifact
          test -f before-artifact/verify/screens/before/manifest.json || { echo "Im Artefakt fehlen die Vorher-Aufnahmen."; exit 1; }
          mkdir -p test-results/verify/screens
          rm -rf test-results/verify/screens/before
          mv before-artifact/verify/screens/before test-results/verify/screens/before

      - name: Review page (before · after · Immowelt)
        if: always() && inputs.label != 'before'
        run: |
          set -euo pipefail
          node scripts/verify/build-review.mjs --root test-results/verify
          echo "Sichtprüfung: Artefakt herunterladen und verify/review/index.html öffnen." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the review to the admin area (/admin/sichtpruefung/)
        if: always() && env.HAVE_SSH == '1'
        env:
          DEPLOY_HOST: ${{ secrets.EICHMANN_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.EICHMANN_DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -f test-results/verify/review/index.html && test -f test-results/verify/screens/after/manifest.json || { echo "Keine vollständige Sichtprüfung – nichts hochgeladen."; exit 0; }
          cd test-results/verify
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("screens/after/manifest.json", "utf8"));
            let inv = null; try { inv = JSON.parse(fs.readFileSync("inventory-after.json", "utf8")); } catch {}
            fs.writeFileSync("meta.json", JSON.stringify({ updated_at: a.captured_at, release_id: a.release_id, pages_after: new Set(a.pages.map((p) => p.path)).size, differences: inv ? inv.differences.length : null, run: process.env.GITHUB_RUN_ID }, null, 2));
            fs.writeFileSync("index.html", "<!doctype html><meta charset=utf-8><meta name=robots content=noindex><meta http-equiv=refresh content=\"0; url=review/index.html\"><a href=review/index.html>Sichtprüfung</a>");
          '
          SSH="ssh -i ~/.ssh/eichmann_deploy -o IdentitiesOnly=yes"
          $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" "rm -rf /var/lib/eichmann/review.incoming && mkdir -p /var/lib/eichmann/review.incoming"
          rsync -az -e "$SSH" --include='index.html' --include='meta.json' --include='inventory-after.*' --include='review/***' --include='screens/' --include='screens/before/***' --include='screens/after/***' --include='screens/immowelt-api/***' --include='screens/immowelt/***' --exclude='*' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:/var/lib/eichmann/review.incoming/"
          # keep the directory itself (it is linked into every release): swap its contents
          $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" 'set -e; R=/var/lib/eichmann/review; mkdir -p "$R"; test -f "$R.incoming/review/index.html"; find "$R" -mindepth 1 -maxdepth 1 -exec rm -rf {} +; mv "$R.incoming"/* "$R"/; rmdir "$R.incoming"; chmod -R a+rX "$R"; du -sh "$R" | cut -f1'
          echo "Sichtprüfung veröffentlicht: https://immobilieneichmann.de/admin/sichtpruefung/" >> "$GITHUB_STEP_SUMMARY"

      - name: Remember this run for the "after" run
        if: inputs.label == 'before'
        run: echo "Vorher-Aufnahme gespeichert. Für die Nachher-Aufnahme als before_run_id eintragen – ${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: immowelt-verify-${{ inputs.label }}-${{ github.run_id }}
          path: test-results/
          retention-days: 90
