name: Layout regression
on:
  push:
    paths:
      - 'css/**'
      - 'js/**'
      - '**/*.html'
      - 'assets/logo.*'
      - 'scripts/test-layout-regression.mjs'
      - 'scripts/test-expose-form.mjs'
      - 'scripts/test-legal-baseline.mjs'
      - 'scripts/sync-immowelt.mjs'
      - 'admin/**'
      - '.github/workflows/layout-regression.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'css/**'
      - 'js/**'
      - '**/*.html'
      - 'assets/logo.*'
      - 'scripts/test-layout-regression.mjs'
      - 'scripts/test-expose-form.mjs'
      - 'scripts/sync-immowelt.mjs'
      - 'admin/**'
      - '.github/workflows/layout-regression.yml'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Syntax check
        run: |
          node --check scripts/sync-immowelt.mjs
          node --check admin/admin.js
      - name: Render listings from mirrored data
        run: node scripts/sync-immowelt.mjs --render-only
      - name: Published listing count must match visibility state
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const data = JSON.parse(await readFile("data/listings.json", "utf8"));
          const expected = (data.listings || []).filter((item) => item.active !== false && item.site_hidden !== true).length;
          const partial = await readFile("partials/listings-grid.html", "utf8");
          const actual = (partial.match(/<(?:a|article) class="listing-card\b/g) || []).length;
          if (actual !== expected) {
            console.error(`Published cards mismatch: expected ${expected}, rendered ${actual}`);
            process.exit(1);
          }
          console.log(`Published cards OK: ${actual}`);
          NODE
      - name: Commit rendered listing output on feature branches
        if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html projekte.html partials/listings-grid.html objekt sitemap.xml
          if git diff --staged --quiet; then
            echo "Generated listing output already current."
          else
            git commit -m "chore: render current listing output"
            git push
          fi
      - name: Upload rendered listing output
        uses: actions/upload-artifact@v4
        with:
          name: generated-listings
          path: |
            index.html
            projekte.html
            partials/listings-grid.html
            objekt/
            sitemap.xml
          if-no-files-found: error
      - name: Generated listing output must be committed
        run: |
          if ! git diff --exit-code -- index.html projekte.html partials/listings-grid.html objekt sitemap.xml; then
            echo "::error::Generated listing HTML is stale. Run npm run sync-immowelt:render and commit the generated output."
            exit 1
          fi
      - name: Legal / privacy baseline
        run: node scripts/test-legal-baseline.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Exposé inquiry flow
        run: node scripts/test-expose-form.mjs
      - name: Layout regression hard gate (Desktop + Mobile)
        env:
          STRICT: "1"
        run: node scripts/test-layout-regression.mjs
      - name: Upload layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-screenshots
          path: test-results/layout/
          if-no-files-found: ignore
