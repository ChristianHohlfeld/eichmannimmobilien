name: Layout regression
on:
  push:
    paths:
      - 'css/**'
      - 'js/**'
      - '**/*.html'
      - 'assets/logo.*'
      - 'scripts/test-layout-regression.mjs'
      - 'scripts/test-legal-baseline.mjs'
      - '.github/workflows/layout-regression.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'css/**'
      - 'js/**'
      - '**/*.html'
      - 'assets/logo.*'
      - 'scripts/test-layout-regression.mjs'
      - '.github/workflows/layout-regression.yml'
      - 'package.json'
      - 'package-lock.json'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Legal / privacy baseline
        run: node scripts/test-legal-baseline.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Layout regression hard gate (Desktop + Mobile)
        env:
          STRICT: "1"
        run: node scripts/test-layout-regression.mjs
      - name: Upload layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-screenshots
          path: test-results/layout/
          if-no-files-found: ignore
