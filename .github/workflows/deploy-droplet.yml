name: Deploy to Droplet

# Live hosting is DigitalOcean droplet eichmann-web (NOT GitHub Pages).
# After Immowelt sync / admin render commits to main, this ships static files to the droplet.

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "css/**"
      - "js/**"
      - "assets/**"
      - "data/**"
      - "objekt/**"
      - "partials/**"
      - "admin/**"
      - "scripts/**"
      - "deploy/**"
      - "package.json"
      - "package-lock.json"
      - "sitemap.xml"
      - "robots.txt"
      - "llms.txt"
      - ".nojekyll"
      - ".github/workflows/deploy-droplet.yml"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Immowelt Official API"
      - "Admin Apply (Save + Render)"
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-eichmann-droplet
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup SSH
        env:
          DEPLOY_KEY: ${{ secrets.EICHMANN_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.EICHMANN_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.EICHMANN_DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_KEY:-}" || { echo "Missing secret EICHMANN_DEPLOY_KEY"; exit 1; }
          test -n "${DEPLOY_HOST:-}" || { echo "Missing secret EICHMANN_DEPLOY_HOST"; exit 1; }
          test -n "${DEPLOY_USER:-}" || { echo "Missing secret EICHMANN_DEPLOY_USER"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/eichmann_deploy
          chmod 600 ~/.ssh/eichmann_deploy
          ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync static site to droplet
        env:
          DEPLOY_HOST: ${{ secrets.EICHMANN_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.EICHMANN_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.EICHMANN_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          DEST_PATH="${DEPLOY_PATH:-/var/www/immobilieneichmann.de}"
          COMMIT="$(git rev-parse --short HEAD)"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/eichmann_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='scripts/' \
            --exclude='deploy/' \
            --exclude='node_modules/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='README.md' \
            --exclude='docs/' \
            --exclude='.gitignore' \
            --exclude='media/' \
            --exclude='var/' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEST_PATH}/"
          # Preserve Eigen uploads (media/eigen) across --delete deploys
          ssh -i ~/.ssh/eichmann_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p '${DEST_PATH}/media/eigen' && chown -R www-data:www-data '${DEST_PATH}/media' || true"
          ssh -i ~/.ssh/eichmann_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chown -R www-data:www-data '${DEST_PATH}' && echo \"DEPLOYED_COMMIT=${COMMIT}\" > /root/.eichmann-deploy-ref && nginx -t && systemctl reload nginx && echo OK ${COMMIT}"

      - name: Sync SQLite app tooling to droplet
        env:
          DEPLOY_HOST: ${{ secrets.EICHMANN_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.EICHMANN_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.EICHMANN_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/eichmann_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new)
          RSYNC_SSH="ssh -i ~/.ssh/eichmann_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          APP=/var/lib/eichmann/app
          DBDIR=/var/lib/eichmann
          SITE="${DEPLOY_PATH:-/var/www/immobilieneichmann.de}"
          "${SSH[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${DBDIR}' '${APP}/data' '${APP}/deploy' && chmod 755 '${DBDIR}'"
          rsync -az -e "${RSYNC_SSH}" \
            --delete \
            --exclude node_modules/ \
            --exclude .git/ \
            --exclude var/ \
            --exclude '**/*.db' \
            ./package.json ./package-lock.json ./scripts ./deploy \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${APP}/"
          if [ -f ./data/listings.json ]; then
            rsync -az -e "${RSYNC_SSH}" ./data/listings.json \
              "${DEPLOY_USER}@${DEPLOY_HOST}:${APP}/data/listings.json"
          fi
          "${SSH[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            APP="${APP}" DB="${DBDIR}/listings.db" SITE="${SITE}" \
            bash -s <<'REMOTE'
          set -euo pipefail
          cd "$APP"
          if ! command -v node >/dev/null 2>&1; then
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            apt-get install -y nodejs build-essential python3
          fi
          node -v
          if [ ! -d node_modules/better-sqlite3 ]; then
            npm ci --omit=dev || npm install --omit=dev
          fi
          export EICHMANN_DB_PATH="$DB"
          export EICHMANN_SITE_ROOT="$SITE"
          if [ ! -f "$DB" ]; then
            node scripts/db-migrate.mjs --bootstrap --json "$APP/data/listings.json"
          else
            node scripts/db-migrate.mjs
          fi
          node scripts/publish-from-db.mjs
          chown -R www-data:www-data "$SITE" || true
          echo "SQLite SoT ready at $DB"
          # Install/refresh localhost admin API + nginx proxy
          bash "$APP/deploy/install-admin-api.sh"
          REMOTE
