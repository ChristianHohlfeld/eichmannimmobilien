<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 88" role="img" aria-labelledby="t d">
  <title id="t">Immobilien Eichmann</title>
  <desc id="d">Quadrat, Wortmarke und Haus-Markenzeichen – Beratung · Verkauf · Vermietung</desc>

  <!-- LEFT: square mark (muted terracotta) -->
  <rect x="4" y="28" width="30" height="30" fill="#A85A4A"/>

  <!-- CENTER: tagline + wordmark (no hyphen), heavy modern sans -->
  <text x="46" y="26"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="9" font-weight="600" letter-spacing="0.1em" fill="#6B6B6B">Beratung · Verkauf · Vermietung</text>
  <text x="46" y="54"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="800" letter-spacing="0.02em" fill="#1A1A1A">IMMOBILIEN EICHMANN</text>

  <!-- RIGHT: HOUSE Markenzeichen (muted sage) -->
  <g fill="#5A7358">
    <polygon points="318,4 288,36 348,36"/>
    <rect x="294" y="36" width="48" height="44"/>
  </g>
</svg>
