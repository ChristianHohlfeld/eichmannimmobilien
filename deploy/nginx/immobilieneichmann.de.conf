# mcp-rate-limit-v1 (managed by deploy/patch-nginx-mcp.py)
limit_req_zone $binary_remote_addr zone=eichmann_mcp:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=eichmann_mcp_gw:10m rate=300r/m;

# Immobilien Eichmann — static site on eichmann-web
# Canonical: https://immobilieneichmann.de (www → apex 301)

# HTTPS: apex only (content)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name immobilieneichmann.de;

    root /var/www/immobilieneichmann.de;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/immobilieneichmann.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/immobilieneichmann.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS (enable after cutover is stable)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;


    # Admin API (localhost Node) — session cookie auth, no GitHub PAT

    # Public MCP Streamable-HTTP (localhost Node) — listings tools
    location = /mcp {
        limit_req zone=eichmann_mcp burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3848/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept $http_accept;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location = /mcp/ {
        return 301 /mcp;
    }

    # mcprush gateway MCP (token-checked in Node via MCPRUSH_TOKEN); /mcp stays open
    location = /mcp-gw {
        limit_req zone=eichmann_mcp_gw burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3848/mcp-gw;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept $http_accept;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Mcprush-Token $http_x_mcprush_token;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location = /mcp-gw/ {
        return 301 /mcp-gw;
    }

    location /admin/api/ {
        client_max_body_size 40m;
        proxy_pass http://127.0.0.1:3847;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
    }

    location = /admin/eigen {
        return 302 /admin/#eigen;
    }
    location = /admin/eigen/ {
        return 302 /admin/#eigen;
    }
    location ^~ /admin/eigen/ {
        return 302 /admin/#eigen;
    }

    location ~* \.(css|js|mjs|jpg|jpeg|png|gif|webp|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
        access_log off;
    }

    location = /data/listings.json {
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # Homepage: serve / via try_files so `index` does NOT internal-redirect
    # to /index.html (that would loop with the external 301 below).
    location = / {
        try_files /index.html =404;
    }

    # Explicit /index.html and /index are soft-duplicates of /
    # (HTML canonical is https://immobilieneichmann.de/)
    location = /index.html {
        return 301 /;
    }
    location = /index {
        return 301 /;
    }

    location = /projekte/ {
        return 301 /projekte.html;
    }

    # seo-ext-301-v1: extensionless URL with an existing .html file → 301 to the
    # canonical .html URL (e.g. /allmannsdorf → /allmannsdorf.html). Exact
    # locations above (/mcp, /mcp-gw, /admin/..., /, /index) are not affected.
    location / {
        if (-f $request_filename.html) {
            return 301 $uri.html$is_args$args;
        }
        try_files $uri $uri.html $uri/ =404;
    }

    autoindex off;
}

# HTTPS: www → apex (preserve path + query)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.immobilieneichmann.de;

    ssl_certificate /etc/letsencrypt/live/immobilieneichmann.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/immobilieneichmann.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://immobilieneichmann.de$request_uri;
}

# HTTP: ACME + redirect to HTTPS apex (www and apex)
server {
    listen 80;
    listen [::]:80;
    server_name immobilieneichmann.de www.immobilieneichmann.de;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/immobilieneichmann.de;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://immobilieneichmann.de$request_uri;
    }
}

# Bare IP / unknown Host — keep reachable for ops checks
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _ 46.101.163.236;

    root /var/www/immobilieneichmann.de;
    index index.html;

    # Homepage: serve / via try_files so `index` does NOT internal-redirect
    # to /index.html (that would loop with the external 301 below).
    location = / {
        try_files /index.html =404;
    }

    # Explicit /index.html and /index are soft-duplicates of /
    # (HTML canonical is https://immobilieneichmann.de/)
    location = /index.html {
        return 301 /;
    }
    location = /index {
        return 301 /;
    }

    location = /projekte/ {
        return 301 /projekte;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    autoindex off;
}
