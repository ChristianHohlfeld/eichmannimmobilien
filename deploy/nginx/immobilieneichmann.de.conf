# Immobilien Eichmann — static site on eichmann-web
# Canonical: https://immobilieneichmann.de (www → apex 301)

# HTTPS: apex only (content)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name immobilieneichmann.de;

    root /var/www/immobilieneichmann.de;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/immobilieneichmann.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/immobilieneichmann.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS (enable after cutover is stable)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;


    # Admin API (localhost Node) — session cookie auth, no GitHub PAT
    location /admin/api/ {
        client_max_body_size 40m;
        proxy_pass http://127.0.0.1:3847;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
    }

    location = /admin/eigen {
        return 302 /admin/#eigen;
    }
    location = /admin/eigen/ {
        return 302 /admin/#eigen;
    }
    location ^~ /admin/eigen/ {
        return 302 /admin/#eigen;
    }

    location ~* \.(css|js|mjs|jpg|jpeg|png|gif|webp|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
        access_log off;
    }

    location = /data/listings.json {
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location = /projekte/ {
        return 301 /projekte;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    autoindex off;
}

# HTTPS: www → apex (preserve path + query)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.immobilieneichmann.de;

    ssl_certificate /etc/letsencrypt/live/immobilieneichmann.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/immobilieneichmann.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://immobilieneichmann.de$request_uri;
}

# HTTP: ACME + redirect to HTTPS apex (www and apex)
server {
    listen 80;
    listen [::]:80;
    server_name immobilieneichmann.de www.immobilieneichmann.de;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/immobilieneichmann.de;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://immobilieneichmann.de$request_uri;
    }
}

# Bare IP / unknown Host — keep reachable for ops checks
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _ 46.101.163.236;

    root /var/www/immobilieneichmann.de;
    index index.html;

    location = /projekte/ {
        return 301 /projekte;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    autoindex off;
}
